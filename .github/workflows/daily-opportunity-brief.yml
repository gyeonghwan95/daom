name: Daily Opportunity Brief

on:
  schedule:
    # GitHub Actions cron은 지연·누락이 있어 아침 슬롯을 3회로 둔다.
    # 중복 발송은 collector 상태(lastEmailKstDate)로 막는다.
    # Asia/Seoul 07:30 = UTC 22:30 (전날). 한국은 서머타임이 없어 고정.
    - cron: "30 22 * * *"
    # 08:15 KST — 1차 누락·API 일시장애 재시도
    - cron: "15 23 * * *"
    # 09:00 KST — 최종 재시도
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "이메일을 발송하지 않고 미리보기만 생성"
        type: boolean
        default: false
      force_email:
        description: "당일 중복 발송 방지 무시"
        type: boolean
        default: false

concurrency:
  group: daily-opportunity-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Warn if required secrets missing
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BID_EMAIL_FROM: ${{ secrets.BID_EMAIL_FROM }}
          BID_EMAIL_TO: ${{ secrets.BID_EMAIL_TO }}
        run: |
          if [ -z "$G2B_SERVICE_KEY" ]; then
            echo "::warning::G2B_SERVICE_KEY 시크릿이 없습니다. 수집은 실패하고 점검 메일을 보냅니다."
          fi
          if [ -z "$RESEND_API_KEY" ] || [ -z "$BID_EMAIL_FROM" ] || [ -z "$BID_EMAIL_TO" ]; then
            echo "::error::RESEND_API_KEY / BID_EMAIL_FROM / BID_EMAIL_TO 시크릿이 없어 메일을 보낼 수 없습니다."
          fi

      # 실행 간 상태(중복 제거·정정 추적·중복 메일 방지)를 cache로 유지.
      # 공개 저장소에 DB를 커밋하지 않는다.
      # 단위 테스트는 발송 이후에 실행한다 — 시간 의존 fixture 등으로
      # 테스트만 실패해도 데일리 브리핑 메일이 통째로 스킵되지 않게 한다.
      - name: Restore collector state
        uses: actions/cache/restore@v5
        with:
          path: collector/data
          key: bid-collector-state-${{ github.run_id }}
          restore-keys: |
            bid-collector-state-

      - name: Collect and send briefing
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
            if [ "${{ inputs.force_email }}" = "true" ]; then EXTRA="$EXTRA --force-email"; fi
          fi
          npm run bid:run -- $EXTRA
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BID_EMAIL_FROM: ${{ secrets.BID_EMAIL_FROM }}
          BID_EMAIL_TO: ${{ secrets.BID_EMAIL_TO }}
          BID_LOOKBACK_DAYS: "3"
          BID_WEEKDAYS_ONLY: "false"

      - name: Save collector state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: collector/data
          key: bid-collector-state-${{ github.run_id }}

      - name: Upload briefing artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: briefing-${{ github.run_id }}
          path: collector/output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Unit tests
        run: npm run bid:test
